<div class="code-container">
      <!-- Barcode view -->
      <div *ngIf="type === 'barcode'" class="barcode-wrapper">
        <svg [attr.width]="width" [attr.height]="height" viewBox="0 0 280 60" class="barcode-svg" role="img" [attr.aria-label]="'Barcode for ARN ' + value">
          <!-- Background -->
          <rect width="100%" height="100%" fill="#ffffff"/>
          <!-- Dynamic bars -->
          <g transform="translate(10, 5)">
            <rect 
              *ngFor="let bar of barcodeBars" 
              [attr.x]="bar.x" 
              y="0" 
              [attr.width]="bar.w" 
              height="40" 
              fill="#000000" />
          </g>
          <!-- Human readable text -->
          <text x="140" y="55" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#000000">
            * {{ value }} *
          </text>
        </svg>
      </div>

      <!-- QR code view -->
      <div *ngIf="type === 'qrcode'" class="qrcode-wrapper">
        <svg [attr.width]="qrSize" [attr.height]="qrSize" viewBox="0 0 100 100" class="qr-svg" role="img" [attr.aria-label]="'QR code for ' + value">
          <!-- White background -->
          <rect width="100" height="100" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          
          <!-- Corner Finder 1: Top-Left -->
          <rect x="8" y="8" width="24" height="24" fill="#000000"/>
          <rect x="12" y="12" width="16" height="16" fill="#ffffff"/>
          <rect x="16" y="16" width="8" height="8" fill="#000000"/>

          <!-- Corner Finder 2: Top-Right -->
          <rect x="68" y="8" width="24" height="24" fill="#000000"/>
          <rect x="72" y="12" width="16" height="16" fill="#ffffff"/>
          <rect x="76" y="16" width="8" height="8" fill="#000000"/>

          <!-- Corner Finder 3: Bottom-Left -->
          <rect x="8" y="68" width="24" height="24" fill="#000000"/>
          <rect x="12" y="72" width="16" height="16" fill="#ffffff"/>
          <rect x="16" y="76" width="8" height="8" fill="#000000"/>

          <!-- Alignment & Data Pattern -->
          <g fill="#000000">
            <rect *ngFor="let m of qrModules" [attr.x]="m.x" [attr.y]="m.y" width="3.5" height="3.5"/>
          </g>

          <!-- MEA Center Emblem mini dot -->
          <rect x="46" y="46" width="8" height="8" fill="#1a365d" rx="1"/>
        </svg>
      </div>
    </div>
