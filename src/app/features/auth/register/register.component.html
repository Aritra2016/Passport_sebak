<div class="auth-page">
      <div class="auth-container">
        <div class="auth-card">
          <div class="auth-header">
            <span class="emblem-icon">🇮🇳</span>
            <h2>User Registration</h2>
            <p>Register as Citizen Applicant on Passport Seva Online Portal</p>
          </div>

          <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
            <div class="form-row">
              <div class="form-group">
                <label for="givenName">Given Name (First & Middle Name) <span class="req">*</span></label>
                <input 
                  id="givenName" 
                  type="text" 
                  formControlName="givenName" 
                  appUpperCase
                  class="form-control" 
                  placeholder="e.g. VIKRAMADITYA"
                  (input)="onInputChange($event, 'givenName')"
                  (keyup)="onInputChange($event, 'givenName')">
                <div *ngIf="isFieldInvalid('givenName')" class="field-error">Given name is required.</div>
              </div>

              <div class="form-group">
                <label for="surname">Surname <span class="req">*</span></label>
                <input 
                  id="surname" 
                  type="text" 
                  formControlName="surname" 
                  appUpperCase
                  class="form-control" 
                  placeholder="e.g. SHARMA"
                  (input)="onInputChange($event, 'surname')"
                  (keyup)="onInputChange($event, 'surname')">
                <div *ngIf="isFieldInvalid('surname')" class="field-error">Surname is required.</div>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="dob">Date of Birth <span class="req">*</span></label>
                <input 
                  id="dob" 
                  type="date" 
                  formControlName="dob" 
                  class="form-control"
                  (input)="onInputChange($event, 'dob')"
                  (keyup)="onInputChange($event, 'dob')"
                  (change)="onInputChange($event, 'dob')">
                <div *ngIf="isFieldInvalid('dob')" class="field-error">Valid date of birth required.</div>
              </div>

              <div class="form-group">
                <label for="rpo">Passport Office Jurisdiction <span class="req">*</span></label>
                <select id="rpo" formControlName="passportOffice" class="form-control" (change)="onInputChange($event, 'passportOffice')">
                  <option value="">-- Select RPO --</option>
                  <option value="RPO_DELHI">RPO Delhi</option>
                  <option value="RPO_MUMBAI">RPO Mumbai</option>
                  <option value="RPO_BENGALURU">RPO Bengaluru</option>
                  <option value="RPO_KOLKATA">RPO Kolkata</option>
                  <option value="RPO_CHENNAI">RPO Chennai</option>
                  <option value="RPO_HYDERABAD">RPO Hyderabad</option>
                  <option value="RPO_AHMEDABAD">RPO Ahmedabad</option>
                </select>
                <div *ngIf="isFieldInvalid('passportOffice')" class="field-error">Please select your RPO.</div>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="email">Email Address <span class="req">*</span></label>
                <input 
                  id="email" 
                  type="email" 
                  formControlName="email" 
                  autocomplete="email"
                  class="form-control" 
                  placeholder="e.g. name@example.com"
                  (input)="onInputChange($event, 'email')"
                  (keyup)="onInputChange($event, 'email')">
                <div *ngIf="isFieldInvalid('email')" class="field-error">Valid email address required.</div>
              </div>

              <div class="form-group">
                <label for="mobile">Mobile Number (10 Digits) <span class="req">*</span></label>
                <input 
                  id="mobile" 
                  type="tel" 
                  formControlName="mobile" 
                  autocomplete="tel"
                  appInputMask="pincode"
                  maxlength="10"
                  class="form-control" 
                  placeholder="e.g. 9876543210"
                  (input)="onInputChange($event, 'mobile')"
                  (keyup)="onInputChange($event, 'mobile')">
                <div *ngIf="isFieldInvalid('mobile')" class="field-error">10-digit mobile number required.</div>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="password">Password <span class="req">*</span></label>
                <input 
                  id="password" 
                  type="password" 
                  formControlName="password" 
                  autocomplete="new-password"
                  class="form-control" 
                  placeholder="Min 8 characters with symbol"
                  (input)="onInputChange($event, 'password')"
                  (keyup)="onInputChange($event, 'password')">
              </div>

              <div class="form-group">
                <label for="confirmPassword">Confirm Password <span class="req">*</span></label>
                <input 
                  id="confirmPassword" 
                  type="password" 
                  formControlName="confirmPassword" 
                  autocomplete="new-password"
                  class="form-control" 
                  placeholder="Re-type password"
                  (input)="onInputChange($event, 'confirmPassword')"
                  (keyup)="onInputChange($event, 'confirmPassword')">
              </div>
            </div>

            <button type="submit" class="btn-primary-gov" [disabled]="registerForm.invalid">
              Register Citizen Account
            </button>
          </form>

          <div class="auth-footer">
            <span>Already have an account?</span>
            <a routerLink="/auth/login" class="link-login">Sign In</a>
          </div>
        </div>
      </div>
    </div>
